name: 'Unzip and build plugin jar'
# Drop this file at .github/workflows/build.yml in a repo that also has
# the project's .zip file sitting in the repo root. On every push (or
# manual "Run workflow" from the Actions tab), this unzips it, finds the
# Gradle project inside, builds it, and uploads the resulting jars as a
# downloadable artifact. No secrets/tokens needed.
#
# NOTE: this project has no Gradle wrapper checked in (I have no network
# access to fetch a real gradle-wrapper.jar binary from where this was
# generated), so this workflow installs Gradle directly via
# gradle/actions/setup-gradle instead of calling ./gradlew. If you add a
# real wrapper later (`gradle wrapper` from a machine with Gradle
# installed), you can switch the "Build" step back to ./gradlew.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in the repo root!"
            exit 1
          fi
          echo "Unzipping $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find project directory
        id: find_dir
        run: |
          PROJECT_DIR=$(find extracted -maxdepth 4 -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find build.gradle.kts anywhere under extracted/"
            exit 1
          fi
          echo "Found project at $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build
        working-directory: ${{ steps.find_dir.outputs.project_dir }}
        run: gradle build --stacktrace

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: uusmp-plugin-jars
          path: ${{ steps.find_dir.outputs.project_dir }}/*/build/libs/*.jar
          if-no-files-found: error
